<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GJS File Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
            }
        })();
    </script>
    <div id="app">
        <div id="auth-loading" class="auth-overlay hidden">
            <div class="loader-content">
                <div class="spinner"></div>
                <p>Updating password...</p>
            </div>
        </div>

        <div class="auth-wrapper page-animate">
            <div class="auth-card glass-panel" id="auth-card-container">
                
                <!-- MOBILE ONLY: Illustration -->
                <div class="mobile-illustration hide-on-desktop">
                    <div class="mobile-brand-logo">FileHub</div>
                    <div class="cloud-illustration">
                        <i data-lucide="cloud" class="main-cloud"></i>
                        <i data-lucide="lock" class="float-icon float-1"></i>
                        <i data-lucide="key" class="float-icon float-2"></i>
                        <i data-lucide="shield-alert" class="float-icon float-3"></i>
                    </div>
                    <div class="mobile-welcome-text">
                        <h2 class="welcome-title">Set New Password</h2>
                        <p class="subtitle">Choose a strong, secure password for your cloud vault.</p>
                    </div>
                </div>

                <!-- DESKTOP ONLY: Brand Section -->
                <div class="brand-section hide-on-mobile">
                    <div class="brand-logo">
                        <i data-lucide="cloud"></i>
                    </div>
                    <h1 class="brand-name">GJS File Hub</h1>
                </div>

                <div class="mobile-form-container">
                    <!-- RESET PASSWORD VIEW -->
                    <div id="reset-password-view" class="auth-view active-view">
                        <div class="view-header hide-on-mobile">
                            <h2 style="font-size:22px; font-weight:800; margin-bottom:6px; color:#1e293b;">Update Password</h2>
                            <p class="subtitle">Set a strong new password for your account.</p>
                        </div>
                        <div class="view-header hide-on-desktop">
                            <h3 class="mobile-form-title">Update Password</h3>
                        </div>

                        <form id="reset-password-form">
                            <div class="input-group">
                                <label for="new-password">New Password</label>
                                <div class="input-wrapper">
                                    <i data-lucide="lock" class="input-icon"></i>
                                    <input type="password" id="new-password" required placeholder="••••••••">
                                </div>
                            </div>

                            <div class="input-group">
                                <label for="confirm-password">Confirm Password</label>
                                <div class="input-wrapper">
                                    <i data-lucide="lock" class="input-icon"></i>
                                    <input type="password" id="confirm-password" required placeholder="••••••••">
                                </div>
                            </div>

                            <button type="submit" class="primary-btn sign-in-btn btn-anim" id="update-password-btn">
                                <span>UPDATE PASSWORD</span>
                                <i data-lucide="check" class="hide-on-mobile"></i>
                            </button>
                        </form>
                    </div>

                    <div id="auth-error" class="error-msg"></div>
                    <div id="auth-msg" class="success-msg"></div>
                </div> <!-- End mobile-form-container -->
            </div>
        </div>
    </div>

    <script type="module" src="/reset-password.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
</body>
</html>
