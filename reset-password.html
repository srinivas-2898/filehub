<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FileHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Auth Layout Wrapper -->
        <div id="auth-wrapper" class="auth-wrapper">
            <!-- Left Side: Hero / Brand -->
            <div class="auth-hero">
                <h1>Set New Password</h1>
                <p>Choose a strong password to secure your account.</p>
                <div class="hero-image-placeholder">
                    <div class="cloud-icon">🛡️</div>
                </div>
            </div>

            <!-- Right Side: Auth Card -->
            <div class="auth-card glass">
                <div id="reset-password-view" class="auth-view active-view">
                    <h2>Update Password</h2>
                    <form id="reset-password-form">
                        <div class="input-container">
                            <label for="new-password">New Password</label>
                            <input type="password" id="new-password" required placeholder="••••••••">
                        </div>
                        <div class="input-container">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="primary-btn" id="update-password-btn">UPDATE PASSWORD</button>
                    </form>
                </div>

                <div id="auth-error" class="error-msg"></div>
                <div id="auth-msg" class="success-msg"></div>
            </div>
        </div>
    </div>

    <script type="module" src="/reset-password.js"></script>
</body>
</html>
