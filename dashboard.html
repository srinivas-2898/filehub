<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FileHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Main View -->
        <div id="main-container" class="main-layout">
            <header class="app-header">
                <h1 class="brand-name">GJS FILEHUB</h1>
                <div class="header-right">
                    <div id="profile-icon" class="profile-circle">?</div>
                    <div id="settings-trigger" class="settings-icon">⚙️</div>
                    
                    <!-- Settings Dropdown -->
                    <div id="settings-dropdown" class="settings-menu hidden">
                        <div class="user-info">
                            <p id="settings-name" class="user-name">Loading...</p>
                            <p id="settings-email" class="user-email">Loading...</p>
                        </div>
                        <div class="menu-divider"></div>
                        <button id="logout-btn" class="menu-item">
                            <span class="icon">🚪</span> Log Out
                        </button>
                        <button id="delete-account-btn" class="menu-item danger">
                            <span class="icon">🗑️</span> Delete Account
                        </button>
                    </div>
                </div>
            </header>
            
            <main class="app-main">
                <!-- Upload Section -->
                <section class="screen-section upload-full" id="drop-zone">
                    <div class="section-content">
                        <div class="hero-image-placeholder">
                            <div class="cloud-icon">☁️</div>
                            <div class="files-floating">📄 🖼️ 📊</div>
                        </div>
                        <h3>Upload your files</h3>
                        <p>Drag and drop your files here, or click to browse</p>
                        <input type="file" id="file-input" style="display: none;" multiple>
                        <button id="trigger-upload" class="primary-btn upload-btn">Select Files</button>
                        
                        <!-- Progress indicator -->
                        <div id="upload-status" class="upload-status hidden">
                            <div class="progress-bar-container">
                                <div id="progress-bar" class="progress-bar"></div>
                            </div>
                            <span id="upload-text">Uploading...</span>
                        </div>
                    </div>
                </section>

                <!-- Gallery Section -->
                <section class="screen-section gallery-full">
                    <div class="section-content">
                        <h3>Your Files</h3>
                        <div id="file-list" class="file-grid">
                            <p class="empty-state" id="empty-state-msg">No files found. Upload something to see it here!</p>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Delete Account Confirmation Modal -->
    <div id="delete-account-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-icon">⚠️</div>
            <h3 class="modal-title">Delete Account</h3>
            <p class="modal-message">Are you sure you want to delete your account? This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="modal-cancel-btn" class="modal-btn modal-btn-cancel">Cancel</button>
                <button id="modal-confirm-btn" class="modal-btn modal-btn-danger">Yes Delete</button>
            </div>
        </div>
    </div>

    <script type="module" src="/app.js"></script>
</body>
</html>
