<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - GJS File Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .offline-icon {
            font-size: 48px;
            color: #ef4444;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        h2 {
            font-weight: 800;
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 8px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .retry-btn {
            background: #4DB6AC;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(77, 182, 172, 0.3);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .retry-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <i data-lucide="wifi-off" style="width: 48px; height: 48px;"></i>
        </div>
        <h2>You are Offline</h2>
        <p>GJS File Hub could not establish an internet connection. Some of your previously cached files may still be accessible once you return to the app.</p>
        <button class="retry-btn" onclick="window.location.reload()">
            <i data-lucide="refresh-cw" style="width: 16px; height: 16px;"></i>
            <span>Retry Connection</span>
        </button>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
