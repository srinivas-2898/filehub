<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FileHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Auth Layout Wrapper -->
        <div id="auth-wrapper" class="auth-wrapper">
            <!-- Left Side: Hero / Brand -->
            <div class="auth-hero">
                <h1>Reset Your Password</h1>
                <p>We'll send you an email with a link to reset your password.</p>
                <div class="hero-image-placeholder">
                    <div class="cloud-icon">🔐</div>
                </div>
            </div>

            <!-- Right Side: Auth Card -->
            <div class="auth-card glass">
                <div id="forgot-password-view" class="auth-view active-view">
                    <h2>Forgot Password</h2>
                    <form id="forgot-password-form">
                        <div class="input-container">
                            <label for="reset-email">Email Address</label>
                            <input type="email" id="reset-email" required placeholder="user@email.com">
                        </div>
                        <button type="submit" class="primary-btn" id="send-link-btn">SEND RESET LINK</button>
                        
                        <div class="divider"><span>OR</span></div>
                        
                        <a href="index.html" class="secondary-btn" style="display: block; text-align: center; text-decoration: none;">BACK TO LOGIN</a>
                    </form>
                </div>

                <div id="auth-error" class="error-msg"></div>
                <div id="auth-msg" class="success-msg"></div>
            </div>
        </div>
    </div>

    <script type="module" src="/forgot-password.js"></script>
</body>
</html>
