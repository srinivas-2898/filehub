<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - GJS File Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app">
        <div class="auth-container">
            <div class="auth-card glass">
                <div class="brand-section">
                    <img src="logo.png" alt="GJS File Hub Logo" class="main-logo">
                    <h1 class="brand-name">GJS FILE HUB</h1>
                </div>

                <div id="forgot-password-view" class="auth-view active-view">
                    <div class="view-header">
                        <h2>FORGOT PASSWORD</h2>
                        <p>Enter your email to receive a reset link.</p>
                    </div>
                    
                    <form id="forgot-password-form">
                        <div class="input-group">
                            <label for="reset-email">Email Address</label>
                            <div class="input-wrapper">
                                <i data-lucide="mail" class="input-icon"></i>
                                <input type="email" id="reset-email" required placeholder="Enter your email">
                            </div>
                        </div>
                        <button type="submit" class="primary-btn" id="send-link-btn">
                            SEND RESET LINK <i data-lucide="send"></i>
                        </button>
                        
                        <div class="divider"><span>OR</span></div>
                        
                        <a href="index.html" class="toggle-text" style="display: block; text-align: center; text-decoration: none; font-weight: 700;">BACK TO LOGIN</a>
                    </form>
                </div>

                <div id="auth-error" class="error-msg"></div>
                <div id="auth-msg" class="success-msg"></div>
            </div>
        </div>
    </div>

    <script type="module" src="/forgot-password.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
